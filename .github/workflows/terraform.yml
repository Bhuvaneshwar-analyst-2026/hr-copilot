name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Initialize
        run: terraform init -reconfigure

      - name: Import existing Azure resources
        run: |
          terraform state show azurerm_resource_group.main >/dev/null 2>&1 || \
          terraform import azurerm_resource_group.main "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/hrcopilot-dev-rg"

          terraform state show azurerm_storage_account.docs >/dev/null 2>&1 || \
          terraform import azurerm_storage_account.docs "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/hrcopilot-dev-rg/providers/Microsoft.Storage/storageAccounts/hrcopilotdevdocs"

          terraform state show azurerm_search_service.search >/dev/null 2>&1 || \
          terraform import azurerm_search_service.search "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/hrcopilot-dev-rg/providers/Microsoft.Search/searchServices/hrcopilot-dev-search"

          terraform state show azurerm_key_vault.kv >/dev/null 2>&1 || \
          terraform import azurerm_key_vault.kv "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/hrcopilot-dev-rg/providers/Microsoft.KeyVault/vaults/hrcopilot-dev-kv"

          terraform state show azurerm_service_plan.app >/dev/null 2>&1 || \
          terraform import azurerm_service_plan.app "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/hrcopilot-dev-rg/providers/Microsoft.Web/serverFarms/hrcopilot-dev-plan"

                    terraform state show azurerm_storage_table.employees >/dev/null 2>&1 || \
          terraform import azurerm_storage_table.employees "https://hrcopilotdevdocs.table.core.windows.net/Tables('Employees')"

          terraform state show azurerm_linux_web_app.agent >/dev/null 2>&1 || \
          terraform import azurerm_linux_web_app.agent "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/hrcopilot-dev-rg/providers/Microsoft.Web/sites/hrcopilot-dev-app"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Set up Python
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pip install -r requirements.txt

      - name: Deploy HR Copilot to Azure Web App
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: hrcopilot-dev-app
          package: .
